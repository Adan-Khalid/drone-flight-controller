name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (versions from uv.lock)
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check src scripts tests hardware/gen

      - name: Tests
        run: uv run pytest -q

      - name: ArduPilot board file check (pins and DMA)
        run: uv run python scripts/check_hwdef.py

  kicad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: kicad/kicad:10.0.8
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - name: Schematic matches the circuit description, pin by pin
        run: python3 hardware/gen/check_netlist.py

      - name: ERC and DRC with KiCad 10.0.8
        run: bash scripts/kicad_checks.sh

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kicad-reports
          path: |
            reports/kicad/
            reports/hardware/
          if-no-files-found: ignore
